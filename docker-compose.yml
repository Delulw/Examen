services:
  mongodb:
    image: mongo:7
    container_name: urban-gardens-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  parcel-service:
    build:
      context: ./parcel-service
    container_name: urban-gardens-parcel-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
      MONGODB_URI: mongodb://mongodb:27017/urban_gardens_parcels
    ports:
      - "8081:8081"
    depends_on:
      mongodb:
        condition: service_healthy

  sensor-service:
    build:
      context: ./sensor-service
    container_name: urban-gardens-sensor-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8082
      MONGODB_URI: mongodb://mongodb:27017/urban_gardens_sensors
    ports:
      - "8082:8082"
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb-data:
